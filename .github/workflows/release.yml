name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  goreleaser:
    name: goreleaser
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: go.mod
          cache: true

      # goreleaser derives the release body from commit subjects, which can say
      # what landed but not what it means: a change to how a coverage number is
      # computed, or an upgrade step a consumer has to take, has no commit
      # subject that conveys it. docs/release-notes/<tag>.md is where that gets
      # written, and this is what puts it in front of the changelog rather than
      # in a file nobody visits.
      #
      # A missing notes file is not an error. Most releases are patches whose
      # commit list genuinely is the whole story, and failing a release over a
      # file the release did not need would make every release depend on
      # remembering a step — the exact failure mode the major-alias move below
      # was automated to fix.
      - name: Assemble the release header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cat docs/release-notes/_header.md > release-header.md
          notes="docs/release-notes/${TAG}.md"
          if [[ -f "$notes" ]]; then
            printf '\n---\n\n' >> release-header.md
            cat "$notes" >> release-header.md
            echo "Release body carries ${notes}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ${notes}; release body is the header plus the generated changelog." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --parallelism 1 --release-header=release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Consumers pin wardnet/bulwark@v1, not a patch tag — the README calls the
      # floating major "its intended delivery channel, moved deliberately on
      # each release". Until now that move was done by hand, so the delivery
      # channel depended on someone remembering after every release.
      #
      # Forgetting is silent and total: every consumer keeps running the old
      # scanner, no drift signal fires, and the release looks published because
      # the assets and the vX.Y.Z tag are all there. The only way to notice is
      # to wonder why a fix did not take effect.
      #
      # So it verifies the move rather than assuming the push worked.
      - name: Move the major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          major="${TAG%%.*}"   # v1.8.0 -> v1
          if [[ ! "$major" =~ ^v[0-9]+$ ]]; then
            echo "::error::could not derive a major tag from ${TAG}"
            exit 1
          fi

          echo "Moving ${major} -> ${TAG} ($(git rev-parse --short "$TAG"))"
          git tag -f "$major" "$TAG"
          git push --force origin "refs/tags/${major}"

          remote_sha=$(git ls-remote origin "refs/tags/${major}" | cut -f1)
          expected_sha=$(git rev-parse "${major}")
          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "::error::${major} did not advance on the remote (got ${remote_sha}, want ${expected_sha})"
            exit 1
          fi
          echo "${major} now points at ${TAG}." >> "$GITHUB_STEP_SUMMARY"
